    <script>
      const poster = document.getElementById("poster");
      const areas = document.querySelectorAll(
        'map[name="image-map"] area'
      );

      areas.forEach((area) => {
        area.dataset.originalCoords = area.coords;
      });

      function resizeImageMap() {
        if (!poster.naturalWidth || !poster.naturalHeight) {
          return;
        }

        const scaleX = poster.clientWidth / poster.naturalWidth;
        const scaleY = poster.clientHeight / poster.naturalHeight;

        areas.forEach((area) => {
          const originalCoords = area.dataset.originalCoords
            .split(",")
            .map(Number);

          const resizedCoords = originalCoords.map((coordinate, index) => {
            const scale = index % 2 === 0 ? scaleX : scaleY;
            return Math.round(coordinate * scale);
          });

          area.coords = resizedCoords.join(",");
        });
      }

      if (poster.complete) {
        resizeImageMap();
      } else {
        poster.addEventListener("load", resizeImageMap);
      }

      window.addEventListener("resize", resizeImageMap);

      const resizeObserver = new ResizeObserver(resizeImageMap);
      resizeObserver.observe(poster);
    </script>
